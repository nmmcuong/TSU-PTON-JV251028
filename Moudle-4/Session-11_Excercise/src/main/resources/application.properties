spring.application.name=session11

spring.datasource.url=jdbc:mysql://localhost:3306/session11_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CẤU HÌNH HIBERNATE / JPA
# ===============================
# Tự động tạo/cập nhật bảng dựa trên Entity
spring.jpa.hibernate.ddl-auto=update
# Khai báo rõ Dialect để tránh lỗi tương thích
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Chuỗi bí mật để ký JWT (Bắt buộc phải dài và khó đoán)
jwt.secret=MySuperSecretKeyForSpringBootApplicationWhichIsVeryLongAndSecure12345
# Thời gian sống của Token tính bằng mili-giây (Ví dụ: 86400000 ms = 24 giờ)
jwt.expiration=86400000

# Giới hạn kích thước tối đa cho 1 file (Ví dụ: 5MB)
spring.servlet.multipart.max-file-size=5MB
# Giới hạn kích thước cho toàn bộ Request
spring.servlet.multipart.max-request-size=5MB

