<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Layout Phức tạp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: white;
        display: flex;
        justify-content: center;
      }

      .grid-container {
        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 10px;

        max-width: 1200px;
        width: 90vw;
      }

      .grid-item {
        background-color: #2c3e50; /* Màu đen đậm như hình */
        color: white;
        font-size: 1.5em;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 6px;

        /* Đặt chiều cao mặc định cho các ô nhỏ */
        min-height: 120px;
      }

      .big-span {
        grid-column: span 2;
        grid-row: span 2;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="grid-item big-span">Big</div>
      <div class="grid-item small">Small 1</div>
      <div class="grid-item small">Small 2</div>
      <div class="grid-item small">Small 3</div>
      <div class="grid-item small">Small 4</div>
      <div class="grid-item big-span">Big</div>
      <div class="grid-item small">Small 5</div>
      <div class="grid-item small">Small 6</div>
      <div class="grid-item small">Small 7</div>
      <div class="grid-item small">Small 8</div>
    </div>
  </body>
</html>
