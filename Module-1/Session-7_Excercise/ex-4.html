<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bố cục Trang Web Cổ điển (Grid)</title>
    <style>
      /* Thiết lập cơ bản */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background-color: white;
      }

      .grid-container {
        display: grid;
        min-height: 100vh;

        grid-template-areas:
          "header header"
          "sidebar content"
          "footer footer";

        /* Định nghĩa chiều rộng cột: Cột 1 (Sidebar) 250px, Cột 2 (Content) chiếm hết phần còn lại */
        grid-template-columns: 250px 1fr;

        /* Định nghĩa chiều cao hàng: Header/Footer tự điều chỉnh, Content chiếm hết phần còn lại */
        grid-template-rows: auto 1fr auto;

        /* Đặt viền bao quanh toàn bộ khung */
        border: 4px solid white;
      }

      .grid-header {
        grid-area: header;
        background-color: #3498db;
        color: white;
        padding: 20px;
        font-size: 1.5em;
        border: 4px solid white;
      }

      /* Sidebar (Màu xanh lá cây) */
      .grid-sidebar {
        grid-area: sidebar;
        background-color: #2ecc71;
        color: white;
        padding: 20px;
        font-size: 1.5em;
        border: 4px solid white;
      }

      /* Content (Màu đỏ cam) */
      .grid-content {
        grid-area: content;
        background-color: #e74c3c;
        color: white;
        padding: 20px;
        font-size: 1.5em;
        border: 4px solid white;
      }

      /* Footer (Màu tím) */
      .grid-footer {
        grid-area: footer;
        background-color: #9b59b6;
        color: white;
        padding: 20px;
        font-size: 1.5em;
        border: 4px solid white;
      }

      /* Căn giữa nội dung trong các ô */
      .grid-header,
      .grid-sidebar,
      .grid-content,
      .grid-footer {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <header class="grid-header">Header</header>
      <aside class="grid-sidebar">Sidebar</aside>
      <main class="grid-content">Content</main>
      <footer class="grid-footer">Footer</footer>
    </div>
  </body>
</html>
