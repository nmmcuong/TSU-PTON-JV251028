<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/register.css" />
  </head>
  <body>
    <div>
      <div class="form-header">
        <h1>Đăng ký tài khoản</h1>
        <p>Đăng ký tài khoản để sử dụng dịch vụ</p>
      </div>
      <form action="#" method="POST" id="registerForm">
        <div class="form-group name-row">
          <div class="name-field">
            <label for="lastName">Họ và tên đệm</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              class="form-input"
            />
          </div>
          <div class="name-field">
            <label for="firstName">Tên</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              class="form-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="you@company.com"
          />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-input"
          />
        </div>

        <div class="terms-group">
          <input type="checkbox" id="confirmReg" name="confirmReg" />
          <label for="confirmReg"
            >Bạn đồng ý với <a href="#">chính sách và điều khoản</a></label
          >
        </div>

        <button type="submit" class="submit-btn">Đăng ký</button>
      </form>
      <div class="form-footer">
        <p>Bạn đã có tài khoản? <a href="#">Đăng nhập</a></p>
      </div>
    </div>
    <script src="../js/register.js" defer></script>
  </body>
  <!-- <a href="./login.html">Chuyển về đăng nhập</a> -->
</html>
