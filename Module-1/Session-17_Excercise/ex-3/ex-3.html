<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Modal Example</title>
    <style>
      /* CSS Cơ bản */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
      }
      .container {
        padding: 20px;
      }

      /* Ẩn Modal mặc định */
      .modal {
        display: none; /* Quan trọng: Ẩn ban đầu */
        position: fixed;
        z-index: 1000; /* Đặt trên tất cả các thành phần khác */
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0, 0, 0, 0.4); /* Màu nền tối (overlay) */
      }

      /* Hộp Nội dung Modal */
      .modal-content {
        background-color: #fefefe;
        margin: 15% auto; /* Đặt ở giữa màn hình (trên dưới 15%) */
        padding: 20px;
        border: 1px solid #888;
        width: 50%; /* Độ rộng Modal */
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
        position: relative;
      }

      /* Nút đóng (x) */
      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }

      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Modal Example</h1>
      <button id="openModalBtn">Open Modal</button>
    </div>

    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close" id="closeModalBtn">&times;</span>
        <p>Some text in the Modal</p>
      </div>
    </div>

    <script>
      // 1. Lấy các tham chiếu DOM
      const modal = document.getElementById("myModal");
      const openBtn = document.getElementById("openModalBtn");
      const closeBtn = document.getElementById("closeModalBtn");

      // 2. Hàm mở Modal
      function openModal() {
        modal.style.display = "block";
      }

      // 3. Hàm đóng Modal
      function closeModal() {
        modal.style.display = "none";
      }

      // 4. Gắn Event Listeners

      // Mở Modal khi nhấn nút "Open Modal"
      openBtn.addEventListener("click", openModal);

      // Đóng Modal khi nhấn nút "x"
      closeBtn.addEventListener("click", closeModal);

      // Đóng Modal khi click vào màn hình tối xung quanh (modal overlay)
      window.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeModal();
        }
      });
    </script>
  </body>
</html>
