<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luyện Tập Responsive 3 Trạng Thái</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: white;
        color: white;
      }

      .column-block {
        background-color: #e57373;
        padding: 20px 10px;
        text-align: center;
        font-size: 1.2em;
        font-weight: bold;
        box-sizing: border-box;
        border-radius: 4px;
        min-height: 80px;
      }

      .main-container {
        display: flex;
        flex-wrap: nowrap;
        gap: 10px;
        max-width: 1000px;
        margin: 0 auto;
      }

      .column-block {
        flex: 1;
      }

      @media (max-width: 768px) {
        .main-container {
          flex-wrap: wrap;
        }

        .column-block {
          width: calc(50% - 5px);
          flex: none;
        }
      }

      @media (max-width: 480px) {
        .main-container {
          flex-direction: column;
        }

        .column-block {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="column-block block-1">Cột 1</div>
      <div class="column-block block-2">Cột 2</div>
      <div class="column-block block-3">Cột 3</div>
      <div class="column-block block-4">Cột 4</div>
    </div>
  </body>
</html>
