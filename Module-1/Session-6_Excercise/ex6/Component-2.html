<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beauty & Fashion News</title>
    <style>
      /* Thiết lập cơ bản */
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: white; /* Nền trắng */
      }

      .news-container {
        max-width: 600px; /* Giới hạn chiều rộng cho giao diện news feed */
        margin: 0 auto;
        padding: 0 15px; /* Padding hai bên */
      }

      /* 1. Header (Tiêu đề chuyên mục) */
      .page-header {
        font-size: 1.2em;
        font-weight: bold;
        color: #333;
        padding: 15px 0 10px 0;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
      }

      .star-text {
        margin-right: 10px;
        padding-right: 10px;
        position: relative;
        /* Giả lập đường kẻ dọc màu cam bên trái chữ (hoặc bên phải tùy thiết kế) */
        padding-left: 10px;
      }

      .star-text::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0; /* Đặt bên trái của text */
        transform: translateY(-50%);
        width: 3px;
        height: 80%;
        background-color: #ff8c00; /* Màu cam */
      }

      /* 2. Bài viết nổi bật (Featured Post) */
      .featured-post {
        margin-top: 15px;
        margin-bottom: 20px;
      }

      /* Container để đặt tiêu đề lên trên ảnh */
      .featured-image-container {
        position: relative; /* Quan trọng: Để caption-overlay định vị tuyệt đối */
        margin-bottom: 10px;
        overflow: hidden;
      }

      .featured-image {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
      }

      /* Lớp phủ (Overlay) chứa tiêu đề */
      .caption-overlay {
        position: absolute;
        bottom: 0; /* Đặt ở cuối ảnh */
        left: 0;
        right: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.8),
          rgba(0, 0, 0, 0)
        ); /* Lớp phủ đen mờ dần */
        padding: 20px 15px 10px;
      }

      .featured-title {
        font-size: 1.5em;
        font-weight: bold;
        line-height: 1.3;
        color: white; /* Tiêu đề màu trắng */
        margin: 0;
      }

      /* Bài viết phụ ngay dưới ảnh */
      .secondary-title {
        font-size: 1em;
        font-weight: bold;
        color: #222;
        margin: 15px 0 20px 0;
        line-height: 1.4;
        cursor: pointer;
      }

      .secondary-title:hover {
        color: #007bff;
      }

      /* Đường phân cách */
      .divider {
        border: 0;
        border-top: 1px solid #eee;
        margin: 10px 0;
      }

      /* Responsive cho màn hình nhỏ */
      @media (max-width: 600px) {
        .news-container {
          padding: 0 10px;
        }
        .featured-title {
          font-size: 1.3em;
        }
        .caption-overlay {
          padding: 15px 10px 5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="news-container">
      <header class="page-header">
        <span class="star-text">BEAUTY & FASHION</span>
      </header>

      <article class="featured-post">
        <div class="featured-image-container">
          <img
            src="../img/cat4.webp"
            alt="Hình ảnh minh họa thời trang"
            class="featured-image"
          />
          <div class="caption-overlay">
            <h2 class="featured-title">
              Sao nữ mờ bát thị phi Kbiz 2024 "tẩy trắng" hoàn toàn, đầu năm mới
              nhá hàng sắp đụng độ Jennie
            </h2>
          </div>
        </div>

        <h3 class="secondary-title">
          Best Of Fashion 2024: Bag Charm tung hoành, Jennie "đánh sập
          internet", Bella Hadid tái xuất...
        </h3>
      </article>

      <hr class="divider" />

      <article class="secondary-post">
        <h3 class="secondary-title">
          Công chúa Kpop "già trân" nhưng không ai chê
        </h3>
      </article>
    </div>
  </body>
</html>
