<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blog - Trang Chủ</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="blog-title">My Blog</h1>
      <nav class="top-nav">
        <a href="#">Home</a>
        <a href="#">Categories</a>
        <a href="#">About</a>
      </nav>
    </header>

    <div class="container">
      <aside class="sidebar">
        <h2>Chuyên mục</h2>
        <ul class="category-list">
          <li><a href="#">CSS</a></li>
          <li><a href="#">JavaScript</a></li>
          <li><a href="#">HTML</a></li>
        </ul>
      </aside>

      <main class="content">
        <article class="post">
          <h3>Bài viết 1</h3>
          <img
            src="../img/cat5.webp"
            alt="Ảnh minh họa bài viết 1"
            class="post-image"
          />
          <p class="post-summary">
            Đây là nơi nội dung tóm tắt của bài viết 1.
          </p>
          <hr />
        </article>

        <article class="post">
          <h3>Bài viết 2</h3>
          <img
            src="../img/cat5.webp"
            alt="Ảnh minh họa bài viết 2"
            class="post-image"
          />
          <p class="post-summary">
            Đây là nơi nội dung tóm tắt của bài viết 2.
          </p>
        </article>
      </main>
    </div>

    <footer class="footer"></footer>
  </body>
</html>
