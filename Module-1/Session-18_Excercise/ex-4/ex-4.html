<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bàn Phím Ảo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="keyboard-container">
      <div class="input-container">
        <input type="text" id="text-input" placeholder="Nhập ở đây..." />
      </div>

      <div class="keyboard-layout">
        <button class="key blue">A</button>
        <button class="key blue">B</button>
        <button class="key blue">C</button>
        <button class="key blue">D</button>
        <button class="key blue">E</button>
        <button class="key blue">F</button>
        <button class="key blue">G</button>
        <button class="key blue">H</button>
        <button class="key blue">I</button>
        <button class="key blue">J</button>

        <button class="key blue">K</button>
        <button class="key blue">L</button>
        <button class="key blue">M</button>
        <button class="key blue">N</button>
        <button class="key blue">O</button>
        <button class="key blue">P</button>
        <button class="key blue">Q</button>
        <button class="key blue">R</button>
        <button class="key blue">S</button>
        <button class="key blue">T</button>

        <button class="key blue">U</button>
        <button class="key blue">V</button>
        <button class="key blue">W</button>
        <button class="key blue">X</button>
        <button class="key blue">Y</button>
        <button class="key blue">Z</button>
        <button class="key red" id="delete-btn">Xóa</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
