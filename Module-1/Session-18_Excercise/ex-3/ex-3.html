<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách Việc Cần Làm</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="todo-container">
      <div class="header">
        <h1>Danh sách những việc cần làm trong năm</h1>
        <div class="input-area">
          <input type="text" id="todo-input" placeholder="Title..." />
          <button id="add-btn">Thêm</button>
        </div>
      </div>

      <div id="todo-list">
        <div class="todo-item completed">
          <span class="task-text">Xin việc ở Google</span>
          <i class="fa-solid fa-check check-icon"></i>
        </div>
        <div class="todo-item completed">
          <span class="task-text">Mua biệt thự</span>
          <i class="fa-solid fa-check check-icon"></i>
        </div>

        <div class="todo-item">
          <span class="task-text">Cưới vợ</span>
        </div>
        <div class="todo-item">
          <span class="task-text">Mua xe hơi</span>
        </div>
        <div class="todo-item">
          <span class="task-text">Sinh con</span>
        </div>
        <div class="todo-item">
          <span class="task-text">Đi du lịch vòng quanh thế giới</span>
        </div>
      </div>
    </div>

    <script src="ex-3.js"></script>
  </body>
</html>
